name: RTL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y verilator python3

      - name: Check generated RV64I, RV64M, RV64A and RV64C image helpers
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/gen_rv64i_smoke.py
          python3 tests/gen_rv64m_smoke.py
          python3 tests/gen_rv64a_smoke.py
          python3 tests/gen_rv64c_smoke.py
          git diff --exit-code -- sim/generated/rv64i_smoke.hex sim/generated/rv64m_smoke.hex sim/generated/rv64a_smoke.hex sim/generated/rv64c_smoke.hex

      - name: Verilator lint
        run: |
          mkdir -p build/verilator/obj_dir
          verilator --lint-only --Wall --Wno-fatal --timing \
            --top-module tb_rv64_core --Mdir build/verilator/obj_dir \
            -f rtl/files.f sim/tb_rv64_core.sv
          verilator --lint-only --Wall --Wno-fatal --timing \
            --top-module tb_rv64m_core --Mdir build/verilator/rv64m_obj_dir \
            -f rtl/files.f sim/tb_rv64m_core.sv
          verilator --lint-only --Wall --Wno-fatal --timing \
            --top-module tb_rv64a_core --Mdir build/verilator/rv64a_obj_dir \
            -f rtl/files.f sim/tb_rv64a_core.sv
          verilator --lint-only --Wall --Wno-fatal --timing \
            --top-module tb_rv64c_core --Mdir build/verilator/rv64c_obj_dir \
            -f rtl/files.f sim/tb_rv64c_core.sv
          verilator --lint-only --Wall --Wno-fatal --timing \
            --top-module tb_rv64c_illegal --Mdir build/verilator/rv64c_illegal_obj_dir \
            -f rtl/files.f sim/tb_rv64c_illegal.sv
          verilator --lint-only --Wall --Wno-fatal --timing \
            --top-module tb_precise_trap --Mdir build/verilator/precise_trap_obj_dir \
            -f rtl/files.f sim/tb_precise_trap.sv
          verilator --lint-only --Wall --Wno-fatal --timing \
            --top-module tb_hardfloat_vendor --Mdir build/verilator/hardfloat_vendor_obj_dir \
            third_party/berkeley-hardfloat/hardfloat.vlt \
            -f rtl/hardfloat.f sim/tb_hardfloat_vendor.sv

      - name: Build and run RV64I, RV64M, RV64A and RV64C smoke tests
        run: |
          verilator --binary --timing --Wall --Wno-fatal \
            --top-module tb_rv64_core --Mdir build/verilator/obj_dir \
            -f rtl/files.f sim/tb_rv64_core.sv
          ./build/verilator/obj_dir/Vtb_rv64_core
          verilator --binary --timing --Wall --Wno-fatal \
            --top-module tb_rv64m_core --Mdir build/verilator/rv64m_obj_dir \
            -f rtl/files.f sim/tb_rv64m_core.sv
          ./build/verilator/rv64m_obj_dir/Vtb_rv64m_core
          verilator --binary --timing --Wall --Wno-fatal \
            --top-module tb_rv64a_core --Mdir build/verilator/rv64a_obj_dir \
            -f rtl/files.f sim/tb_rv64a_core.sv
          ./build/verilator/rv64a_obj_dir/Vtb_rv64a_core
          verilator --binary --timing --Wall --Wno-fatal \
            --top-module tb_rv64c_core --Mdir build/verilator/rv64c_obj_dir \
            -f rtl/files.f sim/tb_rv64c_core.sv
          ./build/verilator/rv64c_obj_dir/Vtb_rv64c_core
          verilator --binary --timing --Wall --Wno-fatal \
            --top-module tb_rv64c_illegal --Mdir build/verilator/rv64c_illegal_obj_dir \
            -f rtl/files.f sim/tb_rv64c_illegal.sv
          ./build/verilator/rv64c_illegal_obj_dir/Vtb_rv64c_illegal
          verilator --binary --timing --Wall --Wno-fatal \
            --top-module tb_precise_trap --Mdir build/verilator/precise_trap_obj_dir \
            -f rtl/files.f sim/tb_precise_trap.sv
          ./build/verilator/precise_trap_obj_dir/Vtb_precise_trap
          verilator --binary --timing --Wall --Wno-fatal \
            --top-module tb_hardfloat_vendor --Mdir build/verilator/hardfloat_vendor_obj_dir \
            third_party/berkeley-hardfloat/hardfloat.vlt \
            -f rtl/hardfloat.f sim/tb_hardfloat_vendor.sv
          ./build/verilator/hardfloat_vendor_obj_dir/Vtb_hardfloat_vendor
